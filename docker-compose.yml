version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: tally_postgres
    environment:
      POSTGRES_USER: tally_user
      POSTGRES_PASSWORD: tally_password
      POSTGRES_DB: tally_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/sample_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./sql/sample_data.sql:/docker-entrypoint-initdb.d/02_data.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tally_user -d tally_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
